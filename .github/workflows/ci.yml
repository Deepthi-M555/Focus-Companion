name: FYNIX CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # CI — FRONTEND
  # ==========================================

  frontend-build:

    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build


  # ==========================================
  # CI — BACKEND
  # ==========================================

  backend-check:

    name: Backend Check

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Syntax check
        working-directory: server
        run: node --check src/server.js


  # ==========================================
  # CI — DOCKER
  # ==========================================

  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-check

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build


  # ==========================================
  # CD — PUBLISH MULTI-ARCH IMAGES
  # ==========================================

  cd-publish:

    name: CD - Publish Docker Images

    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/deepthi-m555/fynix-server:latest
            ghcr.io/deepthi-m555/fynix-server:${{ github.sha }}
      - name: Build and push voice service
        uses: docker/build-push-action@v6
        with:
          context: ./voice-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/deepthi-m555/fynix-voice:latest
            ghcr.io/deepthi-m555/fynix-voice:${{ github.sha }}

      - name: CD completed
        run: |
          echo "FYNIX multi-platform images published."
          echo "Server: ghcr.io/deepthi-m555/fynix-server"
          echo "Voice:  ghcr.io/deepthi-m555/fynix-voice"